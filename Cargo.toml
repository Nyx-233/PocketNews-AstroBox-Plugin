[package]
name = "pocket-news"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { version = "0.57.1", features = ["async", "async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
scraper = { version = "0.29", default-features = false }
encoding_rs = "0.8"
sha1 = "0.10"
md-5 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
waki = "0.5.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

